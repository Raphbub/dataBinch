<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Statistiques et visualisations d'une large sélection de bières de bars Lausanne, Lyon, Riga et Avignon">
  <meta name="keywords" content="dataviz, beer, beers, beer-statistics, brewery, breweries, bière, bières, bar, bars, LausanneLyon, Riga, Avignon">
  <meta name="author" content="Raphaël Bubloz, Romain Lacroix">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>DataBinch</title>

  <!-- Imports des librairies jQuery, D3, bootstrap, leaflet et autres packages-->
  <script src="lib/d3.min.js"></script>
  <script src="lib/leaflet-global.js"></script>
  <script src="lib/tom-select/tom-select.complete.min.js"></script>
  
  <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="lib/tom-select/tom-select.bootstrap5.min.css">
  <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="data/favicon.ico">
  <link rel="stylesheet" href="lib/leaflet.css">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <dialog id="choix-ville">
    <h2>Quelle ville ?</h2>
    <div id="filtercity"></div>
    <button id="valider" type="button" class="btn btn-success">Valider</button>
  </dialog>

  <div class="container-fluid">
  <div class="row" id="entete">
    <div class="col-12 col-lg-9 col-xl-7">
      <div class="row">
        <div id="filterbar" class="col-12 col-md-4"><b>Bar</b><br></div>
        <div id="filterbrass" class="col-12 col-md-4"><b>Brasserie</b><br></div>
        <div id="filterstyle" class="col-12 col-md-4"><b>Style</b><br></div>
        <div id="filterbinch" class="col-12 col-md-4"><b>Bière</b><br></div>
      </div>
    </div>
    <div class="col-lg-3">
      <input type="button" id="boutonReset" value="Reset" onClick="window.location.reload()">
    </div>
  </div>

  <div class="row" id="rang-principal">
    <div class="col-12 col-xl-6" id="colonne-graphique">
      <div id="scatter-load">
        <p class="binchselected"><span id="selectedBeer"></span>
          <span id="BrassSelectedBeer" class="infoSelected"></span></p>
        <p class="binchattributes">
          <span id="StyleSelectedBeer" class="infoSelected"></span>
          <span id="ABVselectedBeer" class="infoSelected"></span>
          <span id="IBUselectedBeer" class="infoSelected"></span>
          <span id="BarSelectedBeer" class="infoSelected"></span>
        </p>
      </div>
    </div>

    <div class="col-12 col-xl-6">
      <div class="row">
        <div id="conteneurCarte" class="carte col-12 col-md-6 col-xl-12"><div id="map"></div></div>
        <div id="distances" class="similaires col-12 col-md-6"><div id="Biereproches"></div></div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="script.js" charset="utf-8"></script>


</body>

</html>
